[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "swear-to-skill"
version = "0.1.0"
description = "Turn recurring coding-agent frustrations into durable remedies."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Repository = "https://github.com/soltraveler-sri/swear-to-skill"

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
s2s = "s2s.cli:main"
swear-to-skill = "s2s.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
s2s = ["lexicons/*.json", "prompts/*.md", "prompts/*.json", "config.example.toml"]

[tool.setuptools.data-files]
"skill/s2s" = ["skill/s2s/SKILL.md"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["real_llm: opt-in smoke test that uses the user's installed Claude CLI"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]
