# Copy this file to ~/.s2s/config.toml (or $S2S_HOME/config.toml) to override
# scaffold defaults. All values below are the defaults when the file is absent.

[thresholds]
# Pump triage after this many untriaged detections, or after the max age below.
triage_untriaged_count = 10
triage_max_age_hours = 24
# Never allow an unattended pump to make more than this many triage calls.
triage_per_run_cap = 25
# Curator review runs after this many unreviewed incidents, or after this age.
curator_unreviewed_count = 10
curator_max_age_days = 7

[curator]
# Review a bounded, never-before-sampled set of recent triage dismissals.
qc_sample_size = 5
# Full context is chunked by label cluster above this per-call character budget.
context_char_budget = 60000

[autonomy]
# Human review is the default gate policy. "autonomous" is opt-in.
# `s2s autonomy on|off` writes S2S_HOME/autonomy-state.json, which overrides
# this value without rewriting this commented file. `on` after a pause resumes.
mode = "review"
# Lowering either confidence bar increases the chance of installing a weak rule.
claude_md_confidence_bar = 0.8
skill_confidence_bar = 0.9
# Raising the weekly cap increases how quickly unattended changes can accumulate.
max_auto_remedies_per_week = 3
# Kept under its original config name for compatibility; this caps all active
# auto-installed remedies, not only skills. Raising it increases persistent scope.
max_active_auto_skills = 15

[notifications]
# The SessionStart digest is on by default; desktop and webhook notifications
# are opt-in. An empty webhook URL disables webhook delivery.
session_start_digest = true
desktop = false
webhook_url = ""
# Only these event names are eligible when either Layer 2 notifier is enabled.
events = ["proposal_pending", "autonomous_action"]

[models]
# Model aliases resolved by the user's Claude Code CLI. Keep policy here, not at call sites.
# Prefix an explicit model with "codex:" to opt into the installed, authenticated
# OpenAI Codex CLI for that stage, for example: triage = "codex:gpt-5.6-luna".
# Codex calls are ephemeral; usage and cost are logged as unknown, while the bulk
# confirmation gate uses a rough $0.01-per-call estimate.
# Measured on the golden corpus: Sonnet is safer for remedy evidence; Haiku remains the frugal option.
triage = "sonnet"
curate = "sonnet"
synthesize = "sonnet"
# Subprocess calls are independent; bounded threads keep bulk work pleasant.
parallelism = 2

[prompts]
# v1 remains available as an explicit A/B arm.
triage = "v2"
# Cluster synthesis takes precedence over conflicting member park/dismiss verdicts.
curate = "v2"
# Stable R-ids make the default synthesis dedup contract round-trip reliably.
synthesize = "v2"

[costs]
# Bulk work above this estimated amount requires --yes or an interactive confirmation.
confirm_threshold_usd = 1.0
